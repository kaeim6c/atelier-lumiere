<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Contact — Atelier Lumière</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map { height: 400px; width: 100%; margin: 2rem 0; }
  </style>
</head>
<body>
  <header>
    <h1>Atelier Lumière</h1>
    <p>Photographe indépendant — Rennes et alentours</p>
  </header>
  <nav>
    <a href="index.html">Accueil</a>
    <a href="candidature.html">Candidater</a>
    <a href="boutique.html">Boutique</a>
    <a href="contact.html">Contact</a>
  </nav>
  <main>
    <h2>Contact</h2>
    <p>Vous avez un projet ? Une demande particulière ? N'hésitez pas à me contacter.</p>
    <div id="map"></div>
    <form action="confirmation.html" method="get">
      <div>
        <label for="nom">Nom :</label>
        <input type="text" id="nom" name="nom" required>
      </div>
      <div>
        <label for="email">Email :</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div>
        <label for="message">Message :</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>
      <button type="submit">Envoyer mon message</button>
    </form>
  </main>
  <footer>
    <p>&copy; 2026 Atelier Lumière — Tous droits réservés</p>
  </footer>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([48.1173, -1.6778], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    L.marker([48.1173, -1.6778]).addTo(map)
      .bindPopup('Atelier Lumière — Rennes')
      .openPopup();
  </script>
  <script src="assets/js/app.js"></script>
</body>
</html>
