<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Coordonnées — Atelier Lumière</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1>Atelier Lumière</h1>
    <p>Photographe indépendant — Rennes et alentours</p>
  </header>
  <nav>
    <a href="index.html">Accueil</a>
    <a href="candidature.html">Candidater</a>
    <a href="boutique.html">Boutique</a>
    <a href="contact.html">Contact</a>
  </nav>
  <main>
    <h2>Vos coordonnées</h2>
    <p>Vous avez sélectionné la photographie <strong id="photo-id"></strong>.</p>
    <form action="recapitulatif.html" method="get">
      <input type="hidden" id="photo" name="photo">
      <div>
        <label for="nom">Nom :</label>
        <input type="text" id="nom" name="nom" required>
      </div>
      <div>
        <label for="email">Email :</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div>
        <label for="adresse">Adresse :</label>
        <textarea id="adresse" name="adresse" rows="3" required></textarea>
      </div>
      <button type="submit">Continuer vers le récapitulatif</button>
    </form>
  </main>
  <footer>
    <p>&copy; 2026 Atelier Lumière — Tous droits réservés</p>
  </footer>
  <script>
    const params = new URLSearchParams(window.location.search);
    const photo = params.get('photo');
    document.getElementById('photo').value = photo;
    document.getElementById('photo-id').textContent = photo;
  </script>
  <script src="assets/js/app.js"></script>
</body>
</html>
